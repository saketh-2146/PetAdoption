name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  selenium_tests:
    name: Selenium Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pytest pytest-html

      - name: Run Selenium Tests
        run: pytest tests_dummy/test_selenium.py --junitxml=selenium-report.xml --html=selenium-report.html --self-contained-html -q

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-HTML-Report
          path: selenium-report.html

      - name: Publish Test Results UI
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: selenium-report.xml
          check_name: "Selenium 300 Tests"

  appium_tests:
    name: Appium Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pytest pytest-html

      - name: Run Appium Tests
        run: pytest tests_dummy/test_appium.py --junitxml=appium-report.xml --html=appium-report.html --self-contained-html -q

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-HTML-Report
          path: appium-report.html

      - name: Publish Test Results UI
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: appium-report.xml
          check_name: "Appium 300 Tests"

  load_tests:
    name: K6 Load Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 load tests
        run: k6 run --out junit=k6-report.xml load_tests/k6_300.js > k6-console-report.txt

      - name: Upload Text Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K6-Text-Report
          path: k6-console-report.txt

      - name: Publish Test Results UI
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: k6-report.xml
          check_name: "K6 Load 300 Tests"
