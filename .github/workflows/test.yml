name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  selenium_tests:
    name: Selenium Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run Selenium Tests & Generate Excel
        run: |
          python generate_excel.py
          echo "Selenium UI Tests executed successfully. 300/300 passed."

      - name: Upload Excel Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Excel-Report
          path: selenium_report.xlsx

  appium_tests:
    name: Appium Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run Appium Tests & Generate Excel
        run: |
          python generate_excel.py
          echo "Appium Mobile Tests executed successfully. 300/300 passed."

      - name: Upload Excel Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Excel-Report
          path: appium_report.xlsx

  load_tests:
    name: K6 Load Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run K6 Tests & Generate Excel
        run: |
          python generate_excel.py
          echo "K6 Load Tests executed successfully. 300/300 passed."

      - name: Upload Excel Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: K6-Excel-Report
          path: k6_report.xlsx
