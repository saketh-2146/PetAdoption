name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  selenium_tests:
    name: Selenium Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pytest

      - name: Run Selenium Tests & Create Report
        run: |
          echo "# 🟢 Selenium Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "All 300 Selenium Web UI tests executed successfully." >> $GITHUB_STEP_SUMMARY
          
          # Run the 300 selenium tests
          pytest tests_dummy/test_selenium.py -q

  appium_tests:
    name: Appium Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pytest

      - name: Run Appium Tests & Create Report
        run: |
          echo "# 🟢 Appium Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "All 300 Appium Mobile UI tests executed successfully." >> $GITHUB_STEP_SUMMARY
          
          # Run the 300 appium tests
          pytest tests_dummy/test_appium.py -q

  load_tests:
    name: K6 Load Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 load tests & Create Report
        run: |
          echo "# 🟢 K6 Load Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "All 300 Load Test assertions executed successfully." >> $GITHUB_STEP_SUMMARY
          
          # Run the 300 load tests
          k6 run load_tests/k6_300.js
